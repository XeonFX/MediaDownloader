# Builds and tests every push/PR to main, so a broken build is caught immediately instead of at
# release time (release.yml only runs when a version tag is pushed). Runs on all three OSes the
# app ships for, since Services/Tray/*.cs has platform-specific P/Invoke code that only a build on
# that platform actually exercises.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore MediaDownloader.slnx
      - name: Build
        run: dotnet build MediaDownloader.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test MediaDownloader.Tests/MediaDownloader.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

  macos-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build and verify local bundle
        run: ./build-macos-app.sh --rid "${{ matrix.rid }}"
      - name: Test extracted archive on native hardware
        run: python3 scripts/test-macos-package.py dist/MediaDownloader-*-${{ matrix.rid }}.zip
