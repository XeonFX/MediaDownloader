# Builds and publishes a GitHub Release whenever a version tag is pushed.
#
# Release process:
#   1. Bump <Version> in MediaDownloader.csproj (keeps local builds honest) and commit.
#   2. git tag v1.1.0 && git push origin main v1.1.0
#   3. This workflow builds macOS (arm64 + x64) and Windows (x64 + arm64) zips, stamped with
#      the tag version, and attaches them to an auto-generated GitHub Release.
#
# Running apps poll the latest release (UpdateService) and offer to self-update, matching
# assets by RID in the file name — keep the MediaDownloader-<version>-<rid>.zip naming.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test MediaDownloader.Tests/MediaDownloader.Tests.csproj -c Release

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-14
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build, ad-hoc sign and package .app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./build-macos-app.sh --version "$VERSION" --rid "${{ matrix.rid }}"
      - name: Test the signed archive
        run: python3 scripts/test-macos-package.py dist/MediaDownloader-*-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.rid }}
          path: dist/MediaDownloader-*.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build zip
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          ./build-windows-app.ps1 -Version $version -Rid ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}
          path: dist/MediaDownloader-*.zip
          if-no-files-found: error

  release:
    needs: [test, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      # UpdateService verifies the zip it downloads against this file before installing it, so a
      # truncated or tampered download is refused instead of replacing the running app.
      - name: Publish checksums
        run: |
          cd assets
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/*.zip
            assets/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            macOS builds are ad-hoc signed and are not notarized by Apple. No Apple developer account is required to build them.
            Apple Silicon (including M1) uses osx-arm64; Intel uses osx-x64. Requires macOS 14 or newer.
            On first launch, macOS may require System Settings → Privacy & Security → Open Anyway.
            Download only from this repository and verify against SHA256SUMS.txt.
